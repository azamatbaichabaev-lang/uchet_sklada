<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0F6E56">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Долги">
<title>Учёт долгов</title>
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<style>
  :root{
    --bg:#F5F6F4; --text:#15171C; --sub:#4F5560; --muted:#737985;
    --line:#B9DCC8; --sep:#B4D3BF; --card:#E2EFE6; --edge:#1D9E75;
    --green:#0F6E56; --green-bg:#CDE8D8; --red:#A32D2D; --red-bg:#F7DADA;
    --sum-green:#0F6E56; --sum-red:#8E2A2A;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--text)}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Inter,Arial,sans-serif;-webkit-text-size-adjust:100%;line-height:1.35}
  .wrap{max-width:560px;margin:0 auto;padding:max(16px,env(safe-area-inset-top)) 16px calc(28px + env(safe-area-inset-bottom))}
  button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
  button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #1D9E75;outline-offset:2px}
  .ic{flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:middle}
  .label{display:block;font-size:12px;color:var(--sub);margin-bottom:4px}
  .field{display:block;width:100%;height:44px;background:#fff;color:var(--text);border:1px solid var(--line);border-radius:10px;padding:0 12px;font-size:16px}
  select.field{appearance:auto}
  .search{position:relative;margin-bottom:10px}
  .search .ic{position:absolute;left:12px;top:12px;color:var(--edge)}
  .search .field{padding-left:40px}
  .btn{height:44px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:#fff;color:var(--green);font-size:14px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
  .btn-pri{background:var(--green);color:#fff;border:0}
  .btn-ghost{background:transparent;color:var(--sub)}
  .iconbtn{flex:none;width:44px;height:44px;padding:0;display:flex;align-items:center;justify-content:center;border-radius:12px;background:#fff;border:1px solid var(--line);color:var(--green)}
  .iconbtn.on{background:var(--green);color:#fff;border-color:var(--green)}
  .top{display:flex;align-items:center;gap:8px;margin-bottom:12px}
  .who{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;font-size:14px;font-weight:600;min-width:0}
  .who span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .grow{flex:1}
  .sum{border-radius:12px;overflow:hidden;margin:10px 0}
  .sum-row{display:flex;justify-content:space-between;align-items:center;gap:8px;color:#fff}
  .sum-top{padding:14px}
  .sum-bot{padding:10px 14px}
  .sum-big{font-size:22px;font-weight:600;white-space:nowrap}
  .sum-mid{font-size:16px;font-weight:600;white-space:nowrap}
  .list{display:flex;flex-direction:column;gap:10px}
  .card{background:var(--card);border:.5px solid rgba(0,0,0,.08);border-left:2px solid var(--edge);border-bottom:2px solid var(--edge);border-radius:12px;overflow:hidden}
  .card-head{width:100%;min-height:60px;border:0;background:transparent;color:inherit;display:flex;align-items:center;gap:10px;padding:10px 14px;text-align:left}
  .avatar{width:36px;height:36px;border-radius:18px;flex:none;display:flex;align-items:center;justify-content:center;background:#fff;color:#0C447C;font-size:14px;font-weight:600}
  .name{display:block;font-size:15px;font-weight:600}
  .small{display:block;font-size:12px;color:var(--sub)}
  .amt{text-align:right}
  .amt b{font-size:15px;font-weight:600}
  .feed{padding:0 14px 8px;border-top:1px solid var(--sep)}
  .toolbar{display:flex;justify-content:space-between;align-items:center;padding-top:8px}
  .h3{font-size:13px;font-weight:600;color:var(--sub)}
  .month{font-size:13px;font-weight:600;color:var(--sub);padding:12px 0 4px}
  .op{padding:10px 0}
  .op.sep{border-top:1px solid var(--sep)}
  .op-row{display:flex;align-items:center;gap:8px}
  .op-main{all:unset;box-sizing:border-box;flex:1;min-width:0;min-height:44px;display:flex;gap:10px;cursor:default}
  button.op-main{cursor:pointer}
  .opic{width:28px;height:28px;border-radius:14px;flex:none;display:flex;align-items:center;justify-content:center}
  .op-body{flex:1;min-width:0}
  .line{display:flex;justify-content:space-between;gap:8px}
  .line.wrap2{flex-wrap:wrap;font-size:12px;color:var(--sub)}
  .t{font-size:14px;font-weight:600}
  .v{font-size:14px;font-weight:600;white-space:nowrap}
  .chips{margin:6px 0;display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-size:12px}
  .chip{padding:3px 8px;border-radius:999px;background:#fff}
  .badge{font-size:11px;padding:2px 8px;border-radius:999px}
  .mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
  .tag-last{font-size:11px;font-weight:600;padding:1px 7px;border-radius:999px;background:var(--green);color:#fff;vertical-align:1px;margin-left:4px}
  .bal{margin:8px 0 2px;padding:10px 12px;border-radius:8px;display:flex;justify-content:space-between;align-items:center;gap:8px}
  .bal.dashed{border:1px dashed currentColor}
  .bal .k{font-size:14px;font-weight:600;display:flex;align-items:center;gap:6px}
  .bal .r{text-align:right}
  .bal .r small{display:block;font-size:11px}
  .bal .r b{font-size:15px;font-weight:600}
  .goods{margin:8px 0 2px;padding:4px 12px 8px;border-radius:8px;background:#fff}
  .goods .row{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-top:.5px solid rgba(0,0,0,.1)}
  .goods .tot{display:flex;justify-content:space-between;padding-top:8px;border-top:.5px solid rgba(0,0,0,.2);font-size:13px;font-weight:600}
  .xbtn{flex:none;width:44px;height:44px;padding:0;display:flex;align-items:center;justify-content:center;background:#fff;color:#27500A;border:.5px solid #97C459;border-radius:10px}
  .grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .pills{display:flex;flex-wrap:wrap;gap:6px;padding:8px 0 4px}
  .pill{height:36px;padding:0 12px;font-size:13px;border-radius:999px;background:#fff;color:var(--text);border:1px solid var(--line)}
  .pill.on{background:var(--green);color:#fff;border-color:var(--green)}
  .pill.reset{background:transparent;color:var(--sub);border-style:dashed}
  .err{font-size:13px;color:var(--red);min-height:20px;padding-top:6px}
  .note{padding:10px 12px;border-radius:10px;font-size:13px}
  .login{max-width:320px;margin:32px auto;text-align:center}
  .login .lock{width:64px;height:64px;border-radius:32px;margin:0 auto 12px;display:flex;align-items:center;justify-content:center;background:var(--green);color:#fff}
  .pin{height:52px;font-size:24px;letter-spacing:8px;text-align:center;border-radius:12px}
  .foot{font-size:12px;color:var(--muted);text-align:center;padding-top:14px}
  .spin{animation:spin 1s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>
</head>
<body>
<main id="app" class="wrap" aria-live="polite"></main>
<script src="config.js"></script>
<script src="vendor/xlsx.mini.min.js" defer></script>
<script src="app.js"></script>
</body>
</html>
